name: Update news and deploy site

on:
  push:
    branches: [main]
  schedule:
    # 06:00-07:00 China time.
    - cron: "0 22-23 * * *"
    # 08:00-23:00 China time.
    - cron: "0 0-15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      should_deploy: ${{ steps.publish.outputs.should_deploy }}
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A queued push must not deploy an older tree over newer main data.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install collector dependencies
        if: github.event_name != 'push'
        run: python -m pip install -r requirements.txt

      - name: Fill missing days and refresh today
        if: github.event_name != 'push'
        id: news
        timeout-minutes: 20
        run: |
          python - <<'PY'
          import copy
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          source = Path("data/current-affairs-data.json")
          script = Path("data/current-affairs-data.js")
          old_json, old_js = source.read_bytes(), script.read_bytes()
          before = json.loads(old_json)
          today = datetime.now(timezone(timedelta(hours=8))).date()
          first = datetime.strptime(before["startDate"], "%Y-%m-%d").date()
          existing = {item["date"] for item in before.get("days", [])}
          missing_past = any(
              (first + timedelta(days=offset)).isoformat() not in existing
              for offset in range(max(0, (today - first).days))
          )
          # Backfill only through yesterday. Today is fetched exactly once.
          if missing_past:
              subprocess.run([sys.executable, "scripts/update_current_affairs.py", "--backfill", "--date", (today - timedelta(days=1)).isoformat()], check=True)
          subprocess.run([sys.executable, "scripts/update_current_affairs.py", "--force"], check=True)

          def meaningful(value):
              result = copy.deepcopy(value)
              result.pop("generatedAt", None)
              for day in result.get("days", []):
                  for status in day.get("sourceStatus", []):
                      status.pop("duration", None)
              return result

          changed = meaningful(before) != meaningful(json.loads(source.read_bytes()))
          if not changed:
              # Timing-only changes must not create commits or daily artifacts.
              source.write_bytes(old_json)
              script.write_bytes(old_js)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("changed=" + str(changed).lower() + "\n")
          PY

      - name: Save refreshed public data
        if: steps.news.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-affairs-data.json data/current-affairs-data.js
          git commit -m "Update daily current affairs"
          # Preserve commits pushed while collection was running. A conflicting
          # edit fails safely; never force-push or overwrite the user's update.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Decide whether a deployment is needed
        id: publish
        if: github.event_name != 'schedule' || steps.news.outputs.changed == 'true'
        run: echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.publish.outputs.should_deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate JavaScript and run offline state/content tests
        if: steps.publish.outputs.should_deploy == 'true'
        run: |
          for file in assets/js/*.js; do node --check "$file"; done
          # The legacy Playwright script requires a browser and asserts the
          # retired two-category search UI; real browser QA stays separate.
          mapfile -t test_files < <(find tests -maxdepth 1 -name '*.cjs' ! -name 'solver-question-type.cjs' | sort)
          node --test "${test_files[@]}"

      - name: Validate question bank and public build boundaries
        if: steps.publish.outputs.should_deploy == 'true'
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Assemble static site
        if: steps.publish.outputs.should_deploy == 'true'
        run: |
          python scripts/assemble_static_site.py
          python scripts/validate_pages_artifact.py

      - name: Upload Pages artifact
        if: steps.publish.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1
          include-hidden-files: true

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
